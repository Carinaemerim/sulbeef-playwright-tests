# Explicit definitions for SonarCloud analysis
sonar.host.url=https://sonarcloud.io

# Exact data for your organization and project in SonarCloud
sonar.organization=Carinaemerim
sonar.projectKey=sulbeef-playwright-tests
sonar.projectName=sulbeef-playwright-tests

# Analysis scope
sonar.sources=tests,support,utils
sonar.exclusions=node_modules/**, .features-gen/**, playwright-report/**, test-results/**, package-lock.json

sonar.sourceEncoding=UTF-8
sonar.javascript.ltsxregex=true

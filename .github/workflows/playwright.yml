name: Playwright Tests with SonarCloud
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # SonarCloud needs the full git history to assign code issues properly

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      env:
        SULBEEF_USER: ${{ secrets.SULBEEF_USER }}
        SULBEEF_PASS: ${{ secrets.SULBEEF_PASS }}
      run: npm run test
      
    # Automated code quality analysis powered by SonarCloud (Configuration is loaded from sonar-project.properties)
    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub core
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Crypted token retrieved from Repository Secrets

    # Upload the Playwright HTML execution report as a pipeline artifact
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
